name: Code Quality & Lighthouse CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository-Code auschecken
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Minify (HTML, CSS, JS komprimieren)
      - name: Minify Assets
        uses: samuelmeuli/action-minify@v1
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}

      # 3. HTMLProofer (Tote Links & HTML-Syntax prüfen)
      - name: Check HTML & Links (HTMLProofer)
        uses: wjdp/htmlproofer-action@v2
        with:
          arguments: >-
            --allow-hash-href
            --check-html
            --ignore-missing-alt
            --ignore-status-codes 403,429,999

      # 4. Lighthouse CI Audit
      - name: Audit with Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:8080/index.html
          uploadArtifacts: true
          temporaryLocalStaticServerConfig: |
            {
              "staticDistDir": "./",
              "port": 8080
            }
