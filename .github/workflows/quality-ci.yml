name: Code Quality & Lighthouse CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository-Code auschecken
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Ruby installieren & HTMLProofer (Link- & HTML-Check)
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install & Run HTMLProofer
        run: |
          gem install html-proofer
          htmlproofer ./index.html --ignore-status-codes "403,429,999" --allow-hash-href --ignore-urls "/blogger\.googleusercontent\.com/,/posts\.json/"
          
      # 3. Minify (CSS, JS und HTML komprimieren)
      - name: Auto Minify
        uses: nizarmah/auto-minify@v3
        with:
          directory: '.'
          overwrite: true

      # 4. Lighthouse CI Audit
      - name: Audit with Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:8080/index.html
          uploadArtifacts: true
          temporaryLocalStaticServerConfig: |
            {
              "staticDistDir": "./",
              "port": 8080
            }
