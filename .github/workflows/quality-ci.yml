name: Code Quality & Lighthouse CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository-Code auschecken
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Ruby installieren & HTMLProofer (Link- & HTML-Check)
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install & Run HTMLProofer
        run: |
          gem install html-proofer
          htmlproofer ./index.html --ignore-status-codes "403,429,999" --allow-hash-href --ignore-urls "/blogger\.googleusercontent\.com/,/posts\.json/"
          
    # Optional: Vor dem Audit lokal minifizieren
      - name: Minify Assets for Audit
        run: |
          npx terser script.js -o script.js --compress --mangle
          npx clean-css-cli style.css -o style.css

    # 3. Lokalen Webserver im Hintergrund starten
      - name: Start Local HTTP Server
        run: |
          python3 -m http.server 8080 &
          sleep 2
          
      # 4. Lighthouse CI Audit
      - name: Audit with Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:8080/index.html
          uploadArtifacts: true
