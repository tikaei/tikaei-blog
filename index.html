<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tikaei Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    // Theme direkt im Kopf setzen, um Flackern zu verhindern
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</head>
<body class="theme-hub">

  <div class="container">
    <div class="top-bar">
      <a href="index.html" class="site-title">Tikaei Hub</a>
      <div class="nav-links">
        <a href="photography.html">Photo</a>
        <a href="music.html">Music</a>
        <a href="moto.html">Moto</a>
        <button class="theme-toggle-btn" onclick="toggleTheme()">
          <span id="theme-icon">🌙</span> <span id="theme-text">Dark</span>
        </button>
      </div>
    </div>

    <div class="search-container">
      <input type="text" id="global-search-input" class="search-input" placeholder="Alle Blogs (Photo, Music, Moto) durchsuchen..." oninput="handleGlobalSearch()">
    </div>

    <div id="tikaei-posts">
      <!-- Posts-Inhalt -->
    </div>

    <footer class="site-footer">
      <p>&copy; Tikaei &bull; <a href="disclaimer.html">Datenschutz & Impressum</a></p>
    </footer>
  </div>

  <script>
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeUI(next);
    }
    function updateThemeUI(theme) {
      document.getElementById('theme-icon').textContent = theme === 'dark' ? '☀️' : '🌙';
      document.getElementById('theme-text').textContent = theme === 'dark' ? 'Light' : 'Dark';
    }
    updateThemeUI(savedTheme);
  </script>
</body>
</html>
