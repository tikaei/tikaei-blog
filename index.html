<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO & Standard Meta -->
  <title>[ti:kæı]'s Blog</title>
  <meta name="description" content="Das private Blog-Netzwerk für Fotografie, Musik und Motorrad-Abenteuer von Toni Korb.">
  <link rel="icon" href="images/favicon.png" type="image/png">
  <link rel="manifest" href="manifest.json">

  <!-- Open Graph / Social Media Vorschau -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.tonikorb.de/">
  <meta property="og:title" content="[ti:kæı]'s Blog">
  <meta property="og:description" content="Das private Blog-Netzwerk für Fotografie, Musik und Motorrad-Abenteuer von Toni Korb.">
  <meta property="og:image" content="https://www.tonikorb.de/images/banner-hub.png">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Performance: Direct Preconnect & Hero Image Preload -->
  <link rel="preconnect" href="https://blogger.googleusercontent.com" crossorigin>
  <link rel="preload" as="image" href="images/banner-hub-desktop.webp" type="image/webp" media="(min-width: 769px)">

  <!-- Local Stylesheet (System-Fonts) -->
  <link rel="stylesheet" href="style.css">

  <!-- Theme-Init (Verhindert White-Flash beim Laden) -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GNER6HTD1X"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-GNER6HTD1X');
  </script>

  <!-- Strukturierte Daten für Suchmaschinen (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "[ti:kæı]'s Blog",
    "url": "https://www.tonikorb.de/",
    "author": {
      "@type": "Person",
      "name": "Toni Korb",
      "url": "https://www.tonikorb.de/"
    },
    "description": "Das private Blog-Netzwerk für Fotografie, Musik und Motorrad-Abenteuer von Toni Korb."
  }
  </script>
</head>
<body class="theme-hub">

  <div class="header-banner">
    <picture>
      <!-- Mobile -->
      <source media="(max-width: 768px)" 
              srcset="images/banner-hub-mobile.webp" 
              type="image/webp">

      <!-- Desktop & Retina -->
      <source media="(min-width: 769px)" 
              srcset="images/banner-hub-desktop.webp" 
              type="image/webp">

      <!-- LCP Haupt-Element -->
      <img src="images/banner-hub-desktop.webp" 
           alt="[ti:kæı] Blog Banner" 
           width="2000" 
           height="800" 
           fetchpriority="high" 
           class="hero-banner-img">
    </picture>
    <div class="header-overlay">
      <h1>[ti:kæı]'s Blog</h1>
    </div>
  </div>

  <div class="container">
    <div class="top-bar">
      <a href="index.html" aria-label="Zur Startseite">
        <img src="images/logo.png" alt="[ti:kæı] Logo" class="site-logo">
      </a>
      <nav class="nav-links" aria-label="Hauptnavigation">
        <a href="photography.html">Photo</a>
        <a href="music.html">Music</a>
        <a href="moto.html">Moto</a>
        <button class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Farbschema umschalten">
          <span id="theme-icon">🌙</span> <span id="theme-text">Dark</span>
        </button>
      </nav>
    </div>

    <div class="search-container">
      <input type="text" id="global-search-input" class="search-input" placeholder="Alle Blogs (Photo, Music, Moto) durchsuchen..." aria-label="Alle Blogs durchsuchen" autocomplete="off">
    </div>

    <main id="tikaei-posts" class="grid-layout" aria-live="polite">
      <div class="card skeleton-card">
        <div class="skeleton-img"></div>
        <div class="card-body">
          <div class="skeleton-text short"></div>
          <div class="skeleton-text title"></div>
          <div class="skeleton-text snippet"></div>
        </div>
      </div>
      <div class="card skeleton-card">
        <div class="skeleton-img"></div>
        <div class="card-body">
          <div class="skeleton-text short"></div>
          <div class="skeleton-text title"></div>
          <div class="skeleton-text snippet"></div>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <p>&copy; [ti:kæı] &bull; RSS Feeds (<a href="https://tikaeiphoto.blogspot.com/feeds/posts/default" target="_blank" rel="noopener">Photo</a>, <a href="https://tikaeimusic.blogspot.com/feeds/posts/default" target="_blank" rel="noopener">Music</a>, <a href="https://tikaeimoto.blogspot.com/feeds/posts/default" target="_blank" rel="noopener">Moto</a>) &bull; <a href="disclaimer.html">Datenschutz & Impressum</a></p>
    </footer>
  </div>

  <script src="script.js"></script>
  <script>initHub();</script>
</body>
</html>
