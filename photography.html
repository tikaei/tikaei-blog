<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tikaei Fotografie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</head>
<body class="theme-photo">

  <!-- Google Drive Header Banner -->
  <div class="header-banner">
    <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgZz8uh009dLPn_QhINi33WU1nq2KD_DswUYdk4vUSrP-9hQdRbP-WiMIIDxxAKHCaHFcy0HeBcd7Fi_w0Pbcw2CdC0Ux4G62Ug5IFWMN_l9daQOi229kHp8pvlPnudmQIDKyshCaX7OEmbxxUwgP5NwYwcn8pkGtXF8O_mqwIIYun-rQ/s1600/image1786059224&width=1400" alt="Fotografie Header">
    <div class="header-overlay">
      <h1>Fotografie</h1>
    </div>
  </div>

  <div class="container">
    <div class="top-bar">
      <a href="index.html" class="site-title">&larr; Zurück zum Hub</a>
      <div class="nav-links">
        <a href="photography.html" class="active">Photo</a>
        <a href="music.html">Music</a>
        <a href="moto.html">Moto</a>
        <button class="theme-toggle-btn" onclick="toggleTheme()">
          <span id="theme-icon">🌙</span> <span id="theme-text">Dark</span>
        </button>
      </div>
    </div>

    <div class="search-container">
      <input type="text" id="search-input" class="search-input" placeholder="Fotografie-Beiträge durchsuchen..." oninput="filterPosts()">
    </div>

    <div id="grid-view" class="grid-layout">
      <!-- Grid Cards -->
    </div>

    <footer class="site-footer">
      <p>&copy; Tikaei &bull; <a href="disclaimer.html">Datenschutz & Impressum</a></p>
    </footer>
  </div>

  <script>
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeUI(next);
    }
    function updateThemeUI(theme) {
      document.getElementById('theme-icon').textContent = theme === 'dark' ? '☀️' : '🌙';
      document.getElementById('theme-text').textContent = theme === 'dark' ? 'Light' : 'Dark';
    }
    updateThemeUI(savedTheme);
  </script>
</body>
</html>
