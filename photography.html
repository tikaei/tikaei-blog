<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="images/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GNER6HTD1X"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

  <!-- Open Graph / Social Media Vorschau -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.tonikorb.de/photography.html">
  <meta property="og:title" content="[ti:kæı] Fotografie">
  <meta property="og:description" content="Kamera-Momente und Fotoprojekte von Toni Korb.">
  <meta property="og:image" content="https://www.tonikorb.de/images/banner-photo.png">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body class="theme-photo">

  <div class="header-banner">
  <img src="images/banner-photo.png" alt="Fotografie Header">
  <div class="header-overlay">
    <h1>Fotografie</h1>
  </div>
</div>

  <div class="container">
    <div class="top-bar">
      <a href="index.html">
        <img src="images/logo.png" alt="[ti:kæı]" class="site-logo">
      </a>
      <div class="nav-links">
        <a href="photography.html" class="active">Photo</a>
        <a href="music.html">Music</a>
        <a href="moto.html">Moto</a>
        <button class="theme-toggle-btn" onclick="toggleTheme()">
          <span id="theme-icon">🌙</span> <span id="theme-text">Dark</span>
        </button>
      </div>
    </div>

    <div id="search-wrapper" class="search-container">
      <input type="text" id="search-input" class="search-input" placeholder="Fotografie-Beiträge durchsuchen..." oninput="filterPosts()">
    </div>

    <div id="grid-view" class="grid-layout">
      <div class="card" style="opacity: 0.6;"><div class="card-img-wrapper"></div><div class="card-body"><div class="card-title">Lade Beiträge...</div></div></div>
    </div>

    <div id="detail-view" style="display: none;">
      <button class="theme-toggle-btn" style="margin-bottom: 20px;" onclick="showGrid()">&larr; Zurück zur Übersicht</button>
      <article>
        <div style="margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;">
          <span id="article-date" class="card-date"></span>
          <h1 id="article-title" style="font-family: 'Roboto', sans-serif; font-weight: 700; font-size: 28px; margin: 5px 0 0 0; color: var(--text-main);"></h1>
        </div>
        <div id="article-body" style="font-size: 16px; line-height: 1.8; color: var(--text-main);"></div>
      </article>

      <div style="margin-top: 50px; padding-top: 30px; border-top: 2px solid var(--border-color);">
        <h3 style="font-family: 'Roboto', sans-serif; font-weight: 700; font-size: 20px; margin-bottom: 15px;">Kommentare (<span id="comment-count">0</span>)</h3>
        <div id="comments-list"></div>
        <div style="margin-top: 25px; background: var(--input-bg); padding: 20px; border-radius: 8px; text-align: center; border: 1px solid var(--border-color);">
          <p style="margin: 0 0 12px 0; font-size: 14px; color: var(--text-muted);">Möchtest du etwas zu diesem Beitrag sagen? Diskutiere direkt im Original-Blog mit:</p>
          <a id="blogger-comment-link" href="" target="_blank" class="card-btn" style="display: inline-block; background-color: var(--accent-color); color: #fff; padding: 10px 20px; border-radius: 20px; text-decoration: none;">Auf Blogger kommentieren &rarr;</a>
        </div>
      </div>
    </div>

    <footer class="site-footer">
      <p>&copy; [ti:kæı] &bull; <a href="disclaimer.html">Datenschutz & Impressum</a></p>
    </footer>
  </div>

  <script>
    const BLOG_FEED_URL = 'https://tikaeiphoto.blogspot.com';
    const DEFAULT_THUMB = 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEg7YFm6gWkAe3q0Z895Lz-duCnSNC57BDfjyGuqmE9h1IY1-61cIIv8_oqJ4qQAO9VOh9W4UYWkWUMHKAWJ2mJBce9rmR-hoOx4PD62oEvwtcVY0ZiMm-FFwHtpuq2v1_mYXbSTbOP4pUDibVVSDJ_BUR0YBaySY0nOvGZ3FLssyFkiGg/s600/image1786059224';
    let loadedPosts = [];

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeUI(next);
    }
    function updateThemeUI(theme) {
      document.getElementById('theme-icon').textContent = theme === 'dark' ? '☀️' : '🌙';
      document.getElementById('theme-text').textContent = theme === 'dark' ? 'Light' : 'Dark';
    }
    updateThemeUI(savedTheme);

    function secureUrl(url) {
      if (!url) return '';
      return url.replace(/^http:\/\//i, 'https://');
    }

    function secureHtmlContent(html) {
      if (!html) return '';
      return html.replace(/src="http:\/\//gi, 'src="https://').replace(/href="http:\/\//gi, 'href="https://');
    }

    function initReader() {
      const callbackName = 'reader_cb_' + Math.floor(Math.random() * 1000000);
      window[callbackName] = function(data) {
        const gridView = document.getElementById('grid-view');
        if (!data?.feed?.entry) { gridView.innerHTML = '<div>Keine Beiträge gefunden.</div>'; return; }

        loadedPosts = data.feed.entry.map(entry => {
          const rawId = entry.id.$t;
          const postIdMatch = rawId.match(/post-(\d+)/);
          const postId = postIdMatch ? postIdMatch : '';
          let postUrl = '';
          if (entry.link) {
            const alt = entry.link.find(l => l.rel === 'alternate');
            if (alt) postUrl = secureUrl(alt.href);
          }
          let title = entry.title ? entry.title.$t : 'Ohne Titel';
          let pubDate = entry.published ? entry.published.$t : '';
          let content = secureHtmlContent(entry.content ? entry.content.$t : (entry.summary ? entry.summary.$t : ''));
          let imageUrl = '';
          if (content) {
            const temp = document.createElement('div');
            temp.innerHTML = content;
            const img = temp.querySelector('img');
            if (img) imageUrl = img.src;
          }
          if (!imageUrl && entry.media$thumbnail) imageUrl = entry.media$thumbnail.url;
          imageUrl = secureUrl(imageUrl ? imageUrl.replace(/\/(s\d+([a-z0-9\-]+)?|w\d+-h\d+([a-z0-9\-]+)?)\//gi, '/s600/') : DEFAULT_THUMB);
          return { postId, postUrl, title, pubDate, content, imageUrl };
        });

        renderGrid(loadedPosts);

        const urlParams = new URLSearchParams(window.location.search);
        const autoOpenUrl = urlParams.get('postUrl');
        if (autoOpenUrl) {
          const postIndex = loadedPosts.findIndex(p => p.postUrl === decodeURIComponent(autoOpenUrl));
          if (postIndex !== -1) openPost(postIndex);
        }
        delete window[callbackName];
      };
      const script = document.createElement('script');
      script.src = `${BLOG_FEED_URL}/feeds/posts/default?alt=json-in-script&callback=${callbackName}&max-results=20`;
      document.body.appendChild(script);
    }

    function filterPosts() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const filtered = loadedPosts.filter(post => {
        const titleMatch = post.title.toLowerCase().includes(query);
        const temp = document.createElement('div');
        temp.innerHTML = post.content;
        const text = (temp.textContent || temp.innerText || '').toLowerCase();
        return titleMatch || text.includes(query);
      });
      renderGrid(filtered);
    }

    function renderGrid(postsToRender) {
      const gridView = document.getElementById('grid-view');
      gridView.innerHTML = '';
      if (postsToRender.length === 0) { gridView.innerHTML = '<div>Keine passenden Beiträge gefunden.</div>'; return; }

      postsToRender.forEach(post => {
        const originalIndex = loadedPosts.findIndex(p => p.postId === post.postId);
        let dateStr = '';
        if (post.pubDate) {
          const d = new Date(post.pubDate);
          if (!isNaN(d)) dateStr = d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }
        const temp = document.createElement('div');
        temp.innerHTML = post.content;
        let text = temp.textContent || temp.innerText || '';
        if (text.length > 90) text = text.substring(0, 90) + '...';

        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openPost(originalIndex);
        card.innerHTML = `
          <div class="card-img-wrapper"><img class="card-img" src="${post.imageUrl}" alt="${post.title}" loading="lazy" onerror="this.src='${DEFAULT_THUMB}'"></div>
          <div class="card-body">
            <div>
              <div class="card-date">${dateStr}</div>
              <h3 class="card-title">${post.title}</h3>
              <div class="card-snippet">${text}</div>
            </div>
            <div class="card-btn">Beitrag lesen &rarr;</div>
          </div>
        `;
        gridView.appendChild(card);
      });
    }

    function openPost(index) {
      const post = loadedPosts[index];
      if (!post) return;
      document.getElementById('search-wrapper').style.display = 'none';
      document.getElementById('grid-view').style.display = 'none';
      document.getElementById('detail-view').style.display = 'block';

      document.getElementById('article-title').textContent = post.title;
      if (post.pubDate) {
        const d = new Date(post.pubDate);
        document.getElementById('article-date').textContent = d.toLocaleDateString('de-DE', { day: '2-digit', month: 'long', year: 'numeric' });
      }
      document.getElementById('article-body').innerHTML = post.content;
      loadComments(post.postId);
      if (post.postUrl) {
        document.getElementById('blogger-comment-link').href = secureUrl(post.postUrl) + '#comment-form';
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showGrid() {
      document.getElementById('search-wrapper').style.display = 'block';
      document.getElementById('detail-view').style.display = 'none';
      document.getElementById('grid-view').style.display = 'grid';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function loadComments(postId) {
      const commentsList = document.getElementById('comments-list');
      const commentCount = document.getElementById('comment-count');
      commentsList.innerHTML = '<div>Lade Kommentare...</div>';
      const callbackName = 'comment_cb_' + Math.floor(Math.random() * 1000000);

      window[callbackName] = function(data) {
        commentsList.innerHTML = '';
        if (data?.feed?.entry) {
          const comments = data.feed.entry;
          commentCount.textContent = comments.length;
          comments.forEach(c => {
            const author = c.author ? c.author[0].name.$t : 'Anonym';
            let dateStr = '';
            if (c.published) {
              const d = new Date(c.published.$t);
              dateStr = d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
            }
            const text = secureHtmlContent(c.content ? c.content.$t : (c.summary ? c.summary.$t : ''));
            const item = document.createElement('div');
            item.style.cssText = 'background: var(--input-bg); border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; border-left: 3px solid var(--accent-color);';
            item.innerHTML = `<div><strong style="font-size: 14px; color: var(--text-main);">${author}</strong> <span style="font-size: 11px; color: var(--text-muted); margin-left: 8px;">${dateStr}</span></div><div style="font-size: 14px; margin-top: 6px; color: var(--text-muted);">${text}</div>`;
            commentsList.appendChild(item);
          });
        } else {
          commentCount.textContent = '0';
          commentsList.innerHTML = '<p style="color: var(--text-muted); font-size: 14px;">Noch keine Kommentare vorhanden.</p>';
        }
        delete window[callbackName];
      };
      const script = document.createElement('script');
      script.src = `${BLOG_FEED_URL}/feeds/${postId}/comments/default?alt=json-in-script&callback=${callbackName}`;
      script.onerror = () => { commentCount.textContent = '0'; commentsList.innerHTML = '<p style="color: var(--text-muted);">Kommentare konnten nicht geladen werden.</p>'; };
      document.body.appendChild(script);
    }

    initReader();
  </script>
</body>
</html>
